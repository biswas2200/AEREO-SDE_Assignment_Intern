# SonarCloud analysis settings, picked up by the scan step in .github/workflows/ci.yml.
# Keys must match the project created on sonarcloud.io.
sonar.organization=biswas2200
sonar.projectKey=biswas2200_AEREO-SDE_Assignment_Intern
sonar.projectName=Bulk Certificate Generator

# .github is included so the CI workflow itself is checked (pinned actions, locked installs).
sonar.sources=app,.github
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12

# Written by `pytest --cov --cov-report=xml` (paths are made repo-relative in pyproject.toml).
sonar.python.coverage.reportPaths=coverage.xml
